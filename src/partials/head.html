<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{pageTitle}}</title>
<meta name="description" content="{{pageDescription}}">
<link rel="canonical" href="{{siteUrl}}{{canonicalPath}}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{siteUrl}}{{canonicalPath}}">
<meta property="og:title" content="{{pageTitle}}">
<meta property="og:description" content="{{pageDescription}}">
<meta property="og:image" content="{{siteUrl}}/images/social-share.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Cormorant+Garamond:ital@1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "HealthAndBeautyBusiness",
  "name": "{{site.businessName}}",
  "alternateName": "{{site.subtitle}}",
  "description": "{{site.positioning}}",
  "url": "{{siteUrl}}",
  "telephone": "{{site.contact.phone}}",
  "email": "{{site.contact.email}}",
  "image": "{{siteUrl}}/images/social-share.jpg",
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Edmonton",
    "addressRegion": "AB",
    "addressCountry": "CA"
  },
  "areaServed": "Edmonton, Alberta and surrounding areas",
  "priceRange": "$$"
}
</script>
